<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRS // RESTRICTED ARCHIVE</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>

<div class="egg-skull" id="egg-skull">
  <pre id="egg-pre"></pre>
  <div class="egg-caption" id="egg-caption">HA HA HA</div>
</div>

<section id="login-screen">
  <div class="grain"></div>
  <div class="halo"></div>
  <div class="term-wrap" id="term-wrap">
    <div class="logo-block">
      <svg class="orbit-mark" viewBox="0 0 74 74" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="37" cy="37" r="16" stroke="#cfe9ec" stroke-width="1.3"/>
        <path d="M21 37h32M37 21c6 6 6 26 0 32M37 21c-6 6-6 26 0 32" stroke="#cfe9ec" stroke-width="1"/>
        <circle class="sat" cx="37" cy="6" r="3" fill="#5fd0d6"/>
        <circle class="sat" cx="10" cy="52" r="3" fill="#5fd0d6"/>
        <circle class="sat" cx="64" cy="52" r="3" fill="#5fd0d6"/>
      </svg>
      <div class="glitch-title" id="site-title" data-text="ARRS">ARRS</div>
      <div class="subtitle" id="site-subtitle">Automated Radio Relay Service</div>
      <div class="node-chip" id="site-node">NODE 14-4 KORD</div>
    </div>

    <div class="term-panel" id="term-panel">
      <div class="term-output" id="term-output"></div>
      <div class="term-current">
        <span class="prompt-prefix" id="prompt-prefix">[ Guest@arrs.host : ~ ] # </span>
        <input id="term-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
      </div>
      <div class="term-hint">type <kbd>help</kbd> for commands, or <kbd>login</kbd> to request archive access.</div>
    </div>
  </div>
</section>

<div class="crt2" id="crt2"></div>
<section id="dossier"></section>

<script src="/js/site.js"></script>
</body>
</html>
